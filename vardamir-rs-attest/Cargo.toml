[package]
name = "vardamir-rs-attest"
version = "0.1.0"
edition = "2024"

[dependencies]
vardamir-rs-core = {path = "../vardamir-rs-core", default-features = false, features = ["std"] }
sha3 = { version = "0.10", default-features = false }
hkdf = { version = "0.12", default-features = false }
hmac = { version = "0.12", default-features = false }

[features]
default = ["std"]
std = ["hkdf/std", "hmac/std", "sha3/std"]
